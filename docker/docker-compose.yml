services:
  pos-db:
    image: postgres:16-alpine
    container_name: balitech-pos-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: pos
      POSTGRES_PASSWORD: ${DB_PASSWORD:-secretpassword}
      POSTGRES_DB: pos
    command: >
      postgres
      -c shared_buffers=128MB
      -c effective_cache_size=384MB
      -c work_mem=8MB
      -c maintenance_work_mem=64MB
      -c max_connections=50
      -c checkpoint_completion_target=0.9
      -c checkpoint_timeout=15min
      -c wal_buffers=8MB
      -c max_wal_size=1GB
      -c min_wal_size=128MB
      -c synchronous_commit=off
      -c full_page_writes=off
      -c random_page_cost=1.1
      -c effective_io_concurrency=200
      -c log_min_duration_statement=1000
    ports:
      - "127.0.0.1:5435:5432"
    volumes:
      - pos_postgres_data:/var/lib/postgresql/data
    shm_size: 128mb
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pos -d pos"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    networks:
      - pos-network
    deploy:
      resources:
        limits:
          memory: 512m
          cpus: "0.5"
        reservations:
          memory: 128m
          cpus: "0.1"
    security_opt:
      - no-new-privileges:true
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  pos-app:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    container_name: balitech-pos-app
    restart: unless-stopped
    depends_on:
      pos-db:
        condition: service_healthy
    volumes:
      - ..:/var/www/pos
    environment:
      - APP_ENV=local
      - APP_DEBUG=true
      - APP_KEY=base64:Ounadfs1LypUUXoqKg5iUwixgnSvKuJKmvPibMhPiKI=
      - DB_CONNECTION=pgsql
      - DB_HOST=pos-db
      - DB_PORT=5432
      - DB_DATABASE=pos
      - DB_USERNAME=pos
      - DB_PASSWORD=${DB_PASSWORD:-secretpassword}
      - SESSION_DRIVER=redis
      - SESSION_LIFETIME=480
      - SESSION_COOKIE=pos_session
      - SESSION_ENCRYPT=true
      - SESSION_DOMAIN=.balitechsolution.com
      - SESSION_SECURE_COOKIE=true
    networks:
      - pos-network

  pos-redis:
    image: redis:7-alpine
    container_name: balitech-pos-redis
    restart: unless-stopped
    command: >
      redis-server
      --maxmemory 256mb
      --maxmemory-policy volatile-lru
      --save 300 1
      --appendonly yes
      --appendfsync everysec
      --loglevel notice
    ports:
      - "127.0.0.1:6380:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - pos-network
    deploy:
      resources:
        limits:
          memory: 96m
          cpus: "0.3"
        reservations:
          memory: 32m
          cpus: "0.05"
    security_opt:
      - no-new-privileges:true
    logging:
      driver: "json-file"
      options:
        max-size: "5m"
        max-file: "3"

  pos-nginx:
    image: nginx:alpine
    container_name: balitech-pos-nginx
    restart: unless-stopped
    ports:
      - "8081:80"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ..:/var/www/pos:ro
    depends_on:
      - pos-app
    networks:
      - pos-network

volumes:
  pos_postgres_data:

networks:
  pos-network:
    driver: bridge
