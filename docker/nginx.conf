server {
    listen 80;
    server_name pos.balitechsolution.com;
    root /var/www/pos/public;

    add_header X-Content-Type-Options "nosniff" always;

    index index.php;
    charset utf-8;

    # /demo route - allow iframe embedding from main website
    location /demo {
        add_header Content-Security-Policy "frame-ancestors 'self' https://balitechsolution.com https://www.balitechsolution.com http://localhost:8080" always;
        try_files $uri $uri/ /index.php?$query_string;
    }

    # All other routes - strict X-Frame-Options
    location / {
        add_header X-Frame-Options "SAMEORIGIN" always;
        try_files $uri $uri/ /index.php?$query_string;
    }

    location = /favicon.ico { access_log off; log_not_found off; }
    location = /robots.txt  { access_log off; log_not_found off; }

    error_page 404 /index.php;

    location ~ \.php$ {
        fastcgi_pass pos-app:9000;
        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        include fastcgi_params;
    }

    location ~ /\.(?!well-known).* {
        deny all;
    }
}
