server {
    listen 80;
    server_name pos.balitechsolution.com;
    root /var/www/pos/public;

    add_header X-Content-Type-Options "nosniff" always;

    index index.php;
    charset utf-8;

    # Enable gzip compression
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css text/xml text/javascript application/json application/javascript application/xml+rss application/rss+xml font/truetype font/opentype application/vnd.ms-fontobject image/svg+xml;
    gzip_disable "msie6";

    # Static assets caching
    location ~* \.(jpg|jpeg|png|gif|ico|css|js|svg|woff|woff2|ttf|eot)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    # /demo route - allow iframe embedding from main website
    location /demo {
        add_header Content-Security-Policy "frame-ancestors 'self' https://balitechsolution.com https://www.balitechsolution.com http://localhost:8080" always;
        try_files $uri $uri/ /index.php?$query_string;
    }

    # All other routes - strict X-Frame-Options
    location / {
        add_header X-Frame-Options "SAMEORIGIN" always;
        try_files $uri $uri/ /index.php?$query_string;
    }

    location = /favicon.ico { access_log off; log_not_found off; }
    location = /robots.txt  { access_log off; log_not_found off; }

    error_page 404 /index.php;

    location ~ \.php$ {
        fastcgi_pass pos-app:9000;
        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        fastcgi_param HTTPS on;
        fastcgi_param HTTP_X_FORWARDED_PROTO https;
        include fastcgi_params;
        fastcgi_buffers 16 16k;
        fastcgi_buffer_size 32k;
        fastcgi_read_timeout 300;
    }

    location ~ /\.(?!well-known).* {
        deny all;
    }
}
